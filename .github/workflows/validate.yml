name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 catalog/validate.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: sdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-25" "build-tools;34.0.0" >/dev/null
      # With the repository secrets DUMBTV_KEYSTORE (the keystore, base64) and DUMBTV_KEYPASS
      # set, every build is signed with the same key, so each one installs over the last.
      # Without them build.sh makes a throwaway key.
      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.DUMBTV_KEYSTORE }}
          KEYPASS: ${{ secrets.DUMBTV_KEYPASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/home.keystore"
            echo "DUMBTV_KEYSTORE=$RUNNER_TEMP/home.keystore" >> "$GITHUB_ENV"
            echo "DUMBTV_KEYPASS=$KEYPASS" >> "$GITHUB_ENV"
            echo "signing with the repository key"
          else
            echo "no DUMBTV_KEYSTORE secret: signing with a throwaway key"
          fi
      - name: build (sdk 25 for fire os 6-8; fails on any android.* API that Android 7.1 lacks)
        run: ./launcher/build.sh
      - name: keep the apk (Actions › this run › Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: dumbtv-home-apk
          path: launcher/build/dumbtv-home.apk
          retention-days: 30
      - name: host-side launcher tests
        run: |
          jar="$ANDROID_HOME/platforms/android-25/android.jar"
          javac -d /tmp/host -cp "$jar" launcher/src/tv/dumbtv/home/Config.java launcher/src/tv/dumbtv/home/Recent.java \
            launcher/tests/RecentTest.java
          java -cp "/tmp/host:$jar" tv.dumbtv.home.RecentTest
      - name: the release apk installs on fire os 6
        run: |
          min=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging launcher/build/dumbtv-home.apk | sed -nE "s/^(minSdkVersion|sdkVersion):'([0-9]+)'.*/\2/p")
          [ "$min" = 25 ] || { echo "expected minSdkVersion 25, found $min"; exit 1; }
      - name: no permissions on Fire OS 7 and later
        run: |
          # The only permissions allowed are Fire OS 6's Keeper trio, each capped at sdk 27, and
          # MODIFY_AUDIO_SETTINGS and INTERNET (normal permissions, granted at install) for the
          # music ceiling and the video carried over a game.
          dump=$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump permissions launcher/build/dumbtv-home.apk)
          echo "$dump"
          extra=$(echo "$dump" | grep uses-permission | grep -v "maxSdkVersion='27'" | grep -v "android.permission.MODIFY_AUDIO_SETTINGS'" | grep -v "android.permission.INTERNET'" || true)
          [ -z "$extra" ] || { echo "the launcher must request no other permissions on sdk 28+, found: $extra"; exit 1; }
          n=$(echo "$dump" | grep -c uses-permission || true)
          [ "$n" -le 5 ] || { echo "expected at most the 3 Fire OS 6 permissions, MODIFY_AUDIO_SETTINGS and INTERNET, found $n"; exit 1; }

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax
        run: for f in scripts/*.sh launcher/*.sh; do bash -n "$f" || exit 1; done
      - name: offline script tests (no device)
        run: python3 -m unittest discover -s tests -v
      - name: launcher version manifest
        run: ./launcher/release-check.sh --manifest
      - name: no private addresses or hardware ids
        run: |
          if grep -rnE '\b(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\b|\b([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}\b' \
               --exclude-dir=.git --exclude-dir=report \
               --include='*.md' --include='*.sh' --include='*.txt' --include='*.yaml' \
               --include='*.yml' --include='*.json' --include='*.py' .; then
            echo "remove the private addresses above; they belong in dumbtv.conf, not the repo"; exit 1
          fi
